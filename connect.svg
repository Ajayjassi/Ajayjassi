<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <linearGradient id="conn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c13"/>
      <stop offset="100%" stop-color="#11131f"/>
    </linearGradient>
    <linearGradient id="conn-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="conn-dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#383b54" fill-opacity="0.3"/>
    </pattern>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    .nudge-arrow { animation: nudge 1.5s ease-in-out infinite; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="846" height="256" rx="20" fill="url(#conn-bg)"/>
  <rect x="2" y="2" width="846" height="256" rx="20" fill="url(#conn-dots)"/>
  <rect x="2" y="2" width="846" height="256" rx="20" fill="none" stroke="url(#conn-border)" stroke-width="1.2"/>

  <!-- Left Side: Pointing Character & Neon Sign -->
  <g transform="translate(45, 30)">
    <!-- Character Avatar Frame -->
    <g transform="translate(0, 10)">
      <!-- Outer Glow circle -->
      <circle cx="65" cy="80" r="65" fill="#13162b" stroke="#38bdf8" stroke-width="2"/>
      
      <!-- Character Head & Upper Body -->
      <circle cx="65" cy="62" r="28" fill="#fbcfe8"/>
      <!-- Sunglasses / Cyber Visor -->
      <rect x="47" y="54" width="36" height="12" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
      <line x1="48" y1="60" x2="82" y2="60" stroke="#38bdf8" stroke-width="1"/>
      <!-- Smile -->
      <path d="M 58 76 Q 65 83 72 76" stroke="#db2777" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Hoodie -->
      <path d="M 30 135 C 30 98, 100 98, 100 135 Z" fill="#3b82f6"/>
      <!-- Hand Pointing Right -->
      <g transform="translate(100, 85)">
        <ellipse cx="14" cy="4" rx="14" ry="7" fill="#fbcfe8"/>
        <!-- Pointing finger -->
        <path d="M 16 0 L 38 2 L 38 7 L 16 7 Z" fill="#fbcfe8"/>
        <line x1="38" y1="4.5" x2="48" y2="4.5" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Neon Handwritten Sign -->
    <g transform="translate(170, 35)">
      <text x="0" y="24" fill="url(#neon-grad)" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-size="28" font-weight="700">
        Let's connect &amp; build! ✨
      </text>
      <text x="0" y="55" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
        Have an exciting project, research, or idea? Reach out!
      </text>
    </g>
  </g>

  <!-- Right Side: Interactive Link Cards -->
  <g transform="translate(480, 25)">
    <!-- Link Card 1: GitHub -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="330" height="46" rx="10" fill="#141727" stroke="#282f4d" stroke-width="1"/>
      <text x="16" y="28" font-size="18">🐙</text>
      <text x="46" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">GitHub</text>
      <text x="110" y="28" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">github.com/Ajayjassi</text>
      <text x="300" y="29" fill="#22d3ee" font-family="sans-serif" font-size="16" font-weight="bold" class="nudge-arrow">→</text>
    </g>

    <!-- Link Card 2: Interactive 3D Projects -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="330" height="46" rx="10" fill="#141727" stroke="#282f4d" stroke-width="1"/>
      <text x="16" y="28" font-size="18">🌌</text>
      <text x="46" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">3D Visuals</text>
      <text x="130" y="28" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">NASA Universe 3D</text>
      <text x="300" y="29" fill="#a78bfa" font-family="sans-serif" font-size="16" font-weight="bold" class="nudge-arrow">→</text>
    </g>

    <!-- Link Card 3: Bioacoustics Research -->
    <g transform="translate(0, 112)">
      <rect x="0" y="0" width="330" height="46" rx="10" fill="#141727" stroke="#282f4d" stroke-width="1"/>
      <text x="16" y="28" font-size="18">🦜</text>
      <text x="46" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Acoustics</text>
      <text x="130" y="28" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">bioacoustic-bird-reader</text>
      <text x="300" y="29" fill="#f472b6" font-family="sans-serif" font-size="16" font-weight="bold" class="nudge-arrow">→</text>
    </g>

    <!-- Link Card 4: Open to Opportunities -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="330" height="38" rx="10" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
      <text x="16" y="24" font-size="16">🤝</text>
      <text x="46" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600">Open for collaboration &amp; high-impact roles</text>
    </g>
  </g>
</svg>
