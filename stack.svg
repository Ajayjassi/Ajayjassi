<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%">
  <defs>
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c13"/>
      <stop offset="100%" stop-color="#11131f"/>
    </linearGradient>
    <linearGradient id="stack-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="stack-dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#383b54" fill-opacity="0.3"/>
    </pattern>
    <radialGradient id="atom-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d0e16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="846" height="376" rx="20" fill="url(#stack-bg)"/>
  <rect x="2" y="2" width="846" height="376" rx="20" fill="url(#stack-dots)"/>
  <rect x="2" y="2" width="846" height="376" rx="20" fill="none" stroke="url(#stack-border)" stroke-width="1.2"/>

  <!-- Section Title -->
  <g transform="translate(36, 36)">
    <text fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700">
      Tech Stack &amp; Orbital Ecosystem
    </text>
    <text y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
      Real-time tools, frameworks, and scientific libraries in active orbit
    </text>
  </g>

  <!-- Left: Orbital Atom Core System -->
  <g transform="translate(190, 220)">
    <!-- Glowing core halo -->
    <circle cx="0" cy="0" r="60" fill="url(#atom-core-glow)"/>
    <circle cx="0" cy="0" r="16" fill="#17192b" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#f472b6">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Ellipse Orbit 1 (-30deg) -->
    <g transform="rotate(-30)">
      <ellipse cx="0" cy="0" rx="140" ry="52" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4,4"/>
      <!-- Traveling Icon Node 1: React -->
      <g>
        <animateMotion path="M -140,0 A 140,52 0 1,0 140,0 A 140,52 0 1,0 -140,0" dur="10s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="15" fill="#0c1929" stroke="#38bdf8" stroke-width="1.5"/>
        <text text-anchor="middle" dy="4" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">⚛</text>
        <!-- Orbiting Moon around React: Vite -->
        <circle cx="20" cy="0" r="5" fill="#a855f7">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- Ellipse Orbit 2 (30deg) -->
    <g transform="rotate(30)">
      <ellipse cx="0" cy="0" rx="140" ry="52" fill="none" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4,4"/>
      <!-- Traveling Icon Node 2: Python -->
      <g>
        <animateMotion path="M 140,0 A 140,52 0 1,0 -140,0 A 140,52 0 1,0 140,0" dur="12s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="15" fill="#1b172e" stroke="#c084fc" stroke-width="1.5"/>
        <text text-anchor="middle" dy="4" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold">🐍</text>
      </g>
    </g>

    <!-- Ellipse Orbit 3 (90deg) -->
    <g transform="rotate(90)">
      <ellipse cx="0" cy="0" rx="135" ry="50" fill="none" stroke="#f472b6" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4,4"/>
      <!-- Traveling Icon Node 3: Three.js / WebGL -->
      <g>
        <animateMotion path="M -135,0 A 135,50 0 1,0 135,0 A 135,50 0 1,0 -135,0" dur="14s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="15" fill="#241121" stroke="#f472b6" stroke-width="1.5"/>
        <text text-anchor="middle" dy="4" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold">▲</text>
      </g>
    </g>
  </g>

  <!-- Right: Categorized Chip Grid -->
  <g transform="translate(410, 85)">
    <!-- Category 1: Frontend & Spatial 3D -->
    <text x="0" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1">FRONTEND &amp; SPATIAL 3D</text>
    <g transform="translate(0, 26)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="80" height="28" rx="6" fill="#131627" stroke="#252b47" stroke-width="1"/>
      <text x="40" y="18" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">React</text>
      <!-- Chip 2 -->
      <rect x="88" y="0" width="105" height="28" rx="6" fill="#131627" stroke="#252b47" stroke-width="1"/>
      <text x="140" y="18" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">TypeScript</text>
      <!-- Chip 3 -->
      <rect x="201" y="0" width="88" height="28" rx="6" fill="#131627" stroke="#252b47" stroke-width="1"/>
      <text x="245" y="18" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">Three.js</text>
      <!-- Chip 4 -->
      <rect x="297" y="0" width="88" height="28" rx="6" fill="#131627" stroke="#252b47" stroke-width="1"/>
      <text x="341" y="18" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">WebGL</text>
    </g>

    <!-- Category 2: Machine Learning & Bioacoustics -->
    <text x="0" y="82" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1">MACHINE LEARNING &amp; AUDIO</text>
    <g transform="translate(0, 92)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="85" height="28" rx="6" fill="#131627" stroke="#252b47" stroke-width="1"/>
      <text x="42" y="18" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">PyTorch</text>
      <!-- Chip 2 -->
      <rect x="93" y="0" width="115" height="28" rx="6" fill="#131627" stroke="#252b47" stroke-width="1"/>
      <text x="150" y="18" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">Transformers</text>
      <!-- Chip 3 -->
      <rect x="216" y="0" width="95" height="28" rx="6" fill="#131627" stroke="#252b47" stroke-width="1"/>
      <text x="263" y="18" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">Librosa</text>
      <!-- Chip 4 -->
      <rect x="319" y="0" width="75" height="28" rx="6" fill="#131627" stroke="#252b47" stroke-width="1"/>
      <text x="356" y="18" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">NumPy</text>
    </g>

    <!-- Category 3: Backend & Systems -->
    <text x="0" y="148" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1">BACKEND &amp; INFRASTRUCTURE</text>
    <g transform="translate(0, 158)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="85" height="28" rx="6" fill="#131627" stroke="#252b47" stroke-width="1"/>
      <text x="42" y="18" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">Node.js</text>
      <!-- Chip 2 -->
      <rect x="93" y="0" width="85" height="28" rx="6" fill="#131627" stroke="#252b47" stroke-width="1"/>
      <text x="135" y="18" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">Python</text>
      <!-- Chip 3 -->
      <rect x="186" y="0" width="85" height="28" rx="6" fill="#131627" stroke="#252b47" stroke-width="1"/>
      <text x="228" y="18" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">FastAPI</text>
      <!-- Chip 4 -->
      <rect x="279" y="0" width="80" height="28" rx="6" fill="#131627" stroke="#252b47" stroke-width="1"/>
      <text x="319" y="18" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">Docker</text>
    </g>

    <!-- Category 4: Tools & Hardware -->
    <text x="0" y="214" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1">WORKFLOW &amp; HARDWARE</text>
    <g transform="translate(0, 224)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="70" height="28" rx="6" fill="#131627" stroke="#252b47" stroke-width="1"/>
      <text x="35" y="18" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">Git</text>
      <!-- Chip 2 -->
      <rect x="78" y="0" width="95" height="28" rx="6" fill="#131627" stroke="#252b47" stroke-width="1"/>
      <text x="125" y="18" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">SolidWorks</text>
      <!-- Chip 3 -->
      <rect x="181" y="0" width="130" height="28" rx="6" fill="#131627" stroke="#252b47" stroke-width="1"/>
      <text x="246" y="18" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">GitHub Actions</text>
      <!-- Chip 4 -->
      <rect x="319" y="0" width="80" height="28" rx="6" fill="#131627" stroke="#252b47" stroke-width="1"/>
      <text x="359" y="18" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">Linux</text>
    </g>
  </g>
</svg>
